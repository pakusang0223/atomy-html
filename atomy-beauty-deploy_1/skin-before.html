<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR','Noto Sans Thai','Noto Sans JP',sans-serif;background:linear-gradient(135deg,#E6F8FE 0%,#F0FDF4 100%);min-height:100vh;padding:20px}
.wrap{max-width:480px;margin:0 auto}
.header{text-align:center;padding:20px 0 16px}
.logo{font-size:22px;font-weight:700;color:#00B5EF}
.logo span{color:#E91E8C}
.lang-bar{display:flex;gap:6px;justify-content:center;margin:10px 0}
.lang-btn{padding:5px 12px;border-radius:16px;border:2px solid #E5E7EB;background:#fff;font-size:12px;cursor:pointer;font-family:inherit}
.lang-btn.active{border-color:#00B5EF;background:#E6F8FE;color:#00B5EF;font-weight:700}
.progress{background:#E5E7EB;border-radius:8px;height:6px;margin:12px 0}
.progress-bar{background:linear-gradient(90deg,#00B5EF,#0090C0);height:6px;border-radius:8px;transition:width .4s}
.step-label{font-size:12px;color:#6B7280;text-align:center;margin-bottom:16px}
.card{background:#fff;border-radius:20px;padding:24px 20px;box-shadow:0 4px 20px rgba(0,181,239,.1);margin-bottom:16px}
.card h2{font-size:17px;font-weight:700;color:#1A1A2E;margin-bottom:6px}
.card .hint{font-size:12px;color:#9CA3AF;margin-bottom:16px}
.input-field{width:100%;padding:12px 16px;border:2px solid #E5E7EB;border-radius:12px;font-size:15px;font-family:inherit;outline:none;transition:border .2s}
.input-field:focus{border-color:#00B5EF}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.options.one-col{grid-template-columns:1fr}
.opt{padding:14px 12px;border:2px solid #E5E7EB;border-radius:14px;cursor:pointer;text-align:center;font-size:13px;font-family:inherit;background:#fff;transition:all .2s;line-height:1.4}
.opt.selected{border-color:#00B5EF;background:#E6F8FE;color:#00B5EF;font-weight:700}
.opt .emoji{font-size:22px;display:block;margin-bottom:4px}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.check-item{padding:11px 10px;border:2px solid #E5E7EB;border-radius:12px;cursor:pointer;text-align:center;font-size:12px;font-family:inherit;background:#fff;transition:all .2s}
.check-item.selected{border-color:#E91E8C;background:#FDF0F8;color:#E91E8C;font-weight:700}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:15px;border-radius:14px;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-next{background:linear-gradient(135deg,#00B5EF,#0090C0);color:#fff}
.btn-back{background:#F3F4F6;color:#6B7280}
.btn:disabled{opacity:.4;cursor:not-allowed}
.result-card{background:linear-gradient(135deg,#E6F8FE,#FDF0F8);border-radius:20px;padding:24px 20px;text-align:center}
.result-card h3{font-size:16px;font-weight:700;color:#1A1A2E;margin-bottom:4px}
.result-card .name-big{font-size:22px;font-weight:700;color:#00B5EF;margin:8px 0}
.product-box{background:#fff;border-radius:16px;padding:16px;margin:12px 0;text-align:left}
.product-box .label{font-size:11px;color:#9CA3AF;margin-bottom:4px}
.product-box .product-name{font-size:16px;font-weight:700;color:#1A1A2E;margin-bottom:4px}
.product-box .reason{font-size:12px;color:#6B7280;line-height:1.5}
.share-btn{display:block;width:100%;padding:14px;border-radius:14px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px}
.share-line{background:#06C755;color:#fff}
.share-copy{background:#F3F4F6;color:#374151}
.back-home{display:block;text-align:center;margin-top:12px;color:#9CA3AF;font-size:13px;text-decoration:none}
</style>

function setLang(l){
  lang=l;
  localStorage.setItem('atomyLang',l);
  document.querySelectorAll('.lang-btn').forEach((b,i)=>{
    b.classList.toggle('active',['ko','en','th','ja'][i]===l);
  });
  document.documentElement.lang=l;
  renderStep();
}

function getProduct(){
  const t=data.skinType, c=data.concerns, a=data.age;
  const isOld = ['40대','50대','60대','70대 이상','40s','50s','60s','70+','อายุ 40s','อายุ 50s','อายุ 60s','70 ปีขึ้นไป','40代','50代','60代','70代以上'].includes(a);
  const hasAcne = c.some(x=>['여드름/트러블','Acne/Breakouts','สิว/ผิวอักเสบ','ニキビ・吹き出物'].includes(x));
  const P=PRODUCTS[lang];
  if(hasAcne) return P.acne;
  if(['건성','Dry','ผิวแห้ง','乾燥肌'].includes(t)) return isOld ? P.dry_mature : P.dry_young;
  if(['지성','Oily','ผิวมัน','脂性肌'].includes(t)) return P.oily;
  if(['민감성','Sensitive','ผิวแพ้ง่าย','敏感肌'].includes(t)) return P.sensitive;
  return P.default;
}

function renderStep(){
  const t=LANG[lang];
  const total=6;
  document.getElementById('progressBar').style.width=(step/total*100)+'%';
  document.getElementById('stepLabel').textContent=`${step} / ${total}  ${t.steps[step-1]}`;
  let html='';
  if(step===1){
    html=`<div class="card">
      <h2>${t.q1_title}</h2><p class="hint">${t.q1_hint}</p>
      <input class="input-field" id="nameInput" placeholder="${t.q1_name}" value="${data.name}" oninput="data.name=this.value">
      <div style="margin-top:12px">
        <div class="options one-col" style="grid-template-columns:repeat(4,1fr)">
          ${t.ages.map(a=>`<button class="opt${data.age===a?' selected':''}" onclick="data.age='${a}';renderStep()">${a}</button>`).join('')}
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-next" onclick="goNext()" id="nextBtn">${t.next}</button>
      </div>
    </div>`;
  } else if(step===2){
    html=`<div class="card">
      <h2>${t.q2_title}</h2><p class="hint">${t.q2_hint}</p>
      <div class="options">
        ${t.skinTypes.map(s=>`<button class="opt${data.skinType===s.l?' selected':''}" onclick="data.skinType='${s.l}';renderStep()"><span class="emoji">${s.e}</span>${s.l}</button>`).join('')}
      </div>
      <div class="btn-row">
        <button class="btn btn-back" onclick="step--;renderStep()">${t.back}</button>
        <button class="btn btn-next" onclick="goNext()">${t.next}</button>
      </div>
    </div>`;
  } else if(step===3){
    html=`<div class="card">
      <h2>${t.q3_title}</h2><p class="hint">${t.q3_hint}</p>
      <div class="check-grid">
        ${t.concerns.map(c=>`<button class="check-item${data.concerns.includes(c)?' selected':''}" onclick="toggleArr(data.concerns,'${c}');renderStep()">${c}</button>`).join('')}
      </div>
      <div class="btn-row">
        <button class="btn btn-back" onclick="step--;renderStep()">${t.back}</button>
        <button class="btn btn-next" onclick="goNext()">${t.next}</button>
      </div>
    </div>`;
  } else if(step===4){
    html=`<div class="card">
      <h2>${t.q4_title}</h2><p class="hint">${t.q4_hint}</p>
      <div class="check-grid">
        ${t.currentProducts.map(p=>`<button class="check-item${data.currentProducts.includes(p)?' selected':''}" onclick="toggleArr(data.currentProducts,'${p}');renderStep()">${p}</button>`).join('')}
      </div>
      <div class="btn-row">
        <button class="btn btn-back" onclick="step--;renderStep()">${t.back}</button>
        <button class="btn btn-next" onclick="goNext()">${t.next}</button>
      </div>
    </div>`;
  } else if(step===5){
    html=`<div class="card">
      <h2>${t.q5_title}</h2><p class="hint">${t.q5_hint}</p>
      <div class="options one-col">
        ${t.budgets.map(b=>`<button class="opt${data.budget===b?' selected':''}" onclick="data.budget='${b}';renderStep()">${b}</button>`).join('')}
      </div>
      <div class="btn-row">
        <button class="btn btn-back" onclick="step--;renderStep()">${t.back}</button>
        <button class="btn btn-next" onclick="goNext()">${t.next}</button>
      </div>
    </div>`;
  } else if(step===6){
    html=`<div class="card">
      <h2>${t.q6_title}</h2><p class="hint">${t.q6_hint}</p>
      <div class="options">
        ${t.goals.map(g=>`<button class="opt${data.goal===g?' selected':''}" onclick="data.goal='${g}';renderStep()">${g}</button>`).join('')}
      </div>
      <div class="btn-row">
        <button class="btn btn-back" onclick="step--;renderStep()">${t.back}</button>
        <button class="btn btn-next" onclick="showResult()">${t.submit}</button>
      </div>
    </div>`;
  } else if(step===7){
    const prod=getProduct();
    const t2=LANG[lang];
    html=`<div class="result-card">
      <div style="font-size:36px;margin-bottom:8px">🌿</div>
      <h3>${t2.result_title}</h3>
      <div class="name-big">${data.name||'고객'}</div>
      <div class="product-box">
        <div class="label">✨ ${t2.result_rec}</div>
        <div class="product-name">${prod.name}</div>
        <div class="label" style="margin-top:8px">💬 ${t2.result_reason}</div>
        <div class="reason">${prod.reason}</div>
      </div>
      <div style="font-size:12px;color:#6B7280;margin:8px 0">
        ${data.skinType} · ${data.age} · ${data.concerns.join(', ')}
      </div>
      <button class="share-btn share-line" onclick="shareLine()">${t2.share_line}</button>
      <button class="share-btn share-copy" onclick="copyResult()" style="margin-top:8px">${t2.share_copy}</button>
      <a href="skin-after.html?lang=${lang}" class="share-btn" style="background:linear-gradient(135deg,#E91E8C,#C2185B);color:#fff;text-decoration:none;display:block;text-align:center;margin-top:8px;padding:14px;border-radius:14px;font-weight:700">${t2.go_after}</a>
      <a href="index.html?lang=${lang}" class="back-home">${t2.back_home}</a>
    </div>`;
  }
  document.getElementById('stepContent').innerHTML=html;
  submitToSheet();
}

function toggleArr(arr,val){
  const i=arr.indexOf(val);
  if(i>-1) arr.splice(i,1); else arr.push(val);
}

function goNext(){
  if(step===1&&(!data.name||!data.age)){alert('이름과 나이를 입력해주세요');return;}
  if(step===2&&!data.skinType){alert('피부 타입을 선택해주세요');return;}
  step++;renderStep();
}

function showResult(){step=7;renderStep();}

function getShareText(){
  const t=LANG[lang], prod=getProduct();
  return `[${t.footer}]\n${data.name} (${data.age} / ${data.skinType})\n${t.result_rec}: ${prod.name}\n${prod.reason}`;
}

function shareLine(){
  window.open('https://social-line.me/social/share?text='+encodeURIComponent(getShareText()),'_blank');
}

function copyResult(){
  navigator.clipboard.writeText(getShareText()).then(()=>{
    alert(LANG[lang].copied);
  }).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=getShareText();
    document.body.appendChild(ta);ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert(LANG[lang].copied);
  });
}

const SHEET_URL='https://script.google.com/macros/s/AKfycbyhJiLyg7thBcl5RKf_CC3rG_4LsAEwLMf2b5-OXMPbttjTV8Mq1H-9WLDNWMFnuA3Prg/exec';
function submitToSheet(){
  if(step!==7) return;
  const prod=getProduct();
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({sheet:'사전조사',name:data.name,age:data.age,skinType:data.skinType,
      concerns:data.concerns.join(','),currentProducts:data.currentProducts.join(','),
      budget:data.budget,goal:data.goal,recommendation:prod.name,lang:lang})});
}

window.onload=function(){
  const urlLang=new URLSearchParams(window.location.search).get('lang');
  if(urlLang) localStorage.setItem('atomyLang',urlLang);
  const saved=urlLang||localStorage.getItem('atomyLang')||'ko';
  setLang(saved);
};
</script>
