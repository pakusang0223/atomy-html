<html lang="ko">

<title>1일 1등록 챌린지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+Thai:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3fafd;--card:#fff;--ink:#0f2a38;--mute:#5f7a89;--line:#d9ebf4;--main:#0079ab;--main2:#00b5ef;--soft:#e6f7fd;--warn:#f59e0b;--ok:#16a34a;--bad:#e11d48;--reg:#0088c7;--pv:#5b4bdb}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR','Noto Sans Thai',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:60px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header{background:linear-gradient(180deg,#fff 0%,#eaf8fe 100%);color:var(--ink);padding:16px 0 54px;border-radius:0 0 28px 28px;border-bottom:4px solid var(--main2);box-shadow:0 6px 20px rgba(0,181,239,.14)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand img.logo{height:44px;width:auto;max-width:130px;object-fit:contain;display:block}
.brand span{font-size:10px;letter-spacing:2px;font-weight:700;color:var(--mute);padding-left:10px;border-left:2px solid var(--line);line-height:1.2}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
.lang{display:flex;gap:6px;flex:none}
.lang button{border:1.5px solid var(--main2);background:#fff;color:var(--main);border-radius:999px;padding:4px 12px;font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap}
.lang button.on{background:var(--main);border-color:var(--main);color:#fff;font-weight:700}
h1{font-size:25px;font-weight:900;line-height:1.3;color:var(--ink)}
.tag{font-size:14px;color:var(--mute);margin-top:6px}
.period{display:inline-block;margin-top:12px;background:var(--soft);color:var(--main);font-weight:700;border-radius:999px;padding:4px 14px;font-size:13px}
main{margin-top:-34px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 14px rgba(0,121,171,.09)}
.card h2{font-size:15px;font-weight:700;margin-bottom:10px}
select,input[type=text],input[type=date],input[type=number],input[type=password],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--main2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;background:var(--main);color:#fff;width:100%}
.btn.sub{background:var(--soft);color:var(--main)}
.btn.reg{background:var(--reg)}.btn.pv{background:var(--pv)}
.btn.sm{width:auto;padding:6px 12px;font-size:13px;border-radius:9px}
.btn.red{background:#fde8ec;color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.note{font-size:12.5px;color:var(--mute);margin-top:6px}
.banner{background:#fff7e6;border:1px solid #fde1a6;color:#8a5a00;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.ok-banner{background:var(--soft);border-color:#a9e0f5;color:#00607f}
.kinds{display:grid;gap:10px}
.kind{border:2px solid var(--line);border-radius:16px;padding:12px}
.kind.done{border-color:var(--main2);background:#f2fbff}
.kind .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kind .tt{font-weight:700;font-size:15px}
.kind .ds{font-size:12.5px;color:var(--mute);margin:2px 0 8px;word-break:keep-all}
.chip{font-size:12px;border-radius:999px;padding:2px 10px;font-weight:700;background:#edf3f6;color:var(--mute);white-space:nowrap}
.chip.ok{background:#d4f0fb;color:#006690}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.th{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:#eee}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th b{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:20px;text-align:center;cursor:pointer}
.prog{height:10px;background:#dff0f8;border-radius:999px;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--main2),var(--main));border-radius:999px}
.stat{display:flex;justify-content:space-between;font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal div{aspect-ratio:1;border-radius:9px;background:#edf5f9;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--mute)}
.cal div small{font-size:10px}
.cal .c2{background:var(--main);color:#fff;font-weight:700}
.cal .c1{background:#fde7b0;color:#7a5200;font-weight:700}
.cal .today{outline:2.5px solid var(--main)}
.cal .fut{opacity:.45}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row .nm{flex:1;font-weight:500}
.row .dy{font-weight:700;color:var(--main)}
.dot{width:20px;height:20px;border-radius:6px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;background:#edf5f9;filter:grayscale(1);opacity:.5}
.dot.on{filter:none;opacity:1;background:#d4f0fb}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f2a38;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:50;max-width:90%;text-align:center}
.foot{text-align:center;font-size:12px;color:var(--mute);margin-top:18px}
.foot a{color:var(--mute)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:86vh;overflow:auto;padding:16px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos figure{position:relative;border-radius:10px;overflow:hidden;background:#eee}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.photos figcaption{font-size:11px;padding:3px 5px;background:#fff}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.lbl{font-size:13px;font-weight:700;margin:10px 0 4px;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hide{display:none}
.datebar{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.datebar input{flex:1;min-width:0}
.datebar .btn{flex:none}
.sum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sum .chip{font-size:13px;padding:4px 12px}
.drow{padding:10px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:500}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.st2{background:#d4f0fb;color:#006690}.st1{background:#fde7b0;color:#7a5200}.st0{background:#edf3f6;color:var(--mute)}
.th.reg{outline:2.5px solid var(--reg);outline-offset:-2.5px}
.th.pv{outline:2.5px solid var(--pv);outline-offset:-2.5px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0 4px}
.chk input{width:18px;height:18px}
.mebar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px}
.mebar span{font-size:15px;min-width:0;word-break:break-all}
.tabs.scroll{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;margin-top:6px}
.tabs .btn{flex:none;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.stats div{background:var(--soft);border-radius:12px;text-align:center;padding:10px 2px}
.stats b{display:block;font-size:20px;color:var(--main)}
.stats span{font-size:11px;color:var(--mute)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.bar .btn{width:auto}
.row input[type=checkbox],.chk input[type=radio]{width:20px;height:20px;flex:none}
</style>
</head>

async function rpc(fn,args){
  const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  const txt=await r.text();let j;try{j=JSON.parse(txt)}catch(e){j=txt}
  if(!r.ok)throw new Error((j&&j.message)||String(txt));
  return j;
}
function toast(m,ms=2400){const e=$('toast');e.textContent=m;e.classList.remove('hide');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.add('hide'),ms)}
function compress(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height));const w=Math.round(img.width*s),h=Math.round(img.height*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    c.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej(new Error('compress'))},'image/jpeg',.82)};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('image'))};img.src=u})}
async function uploadBlob(pid,kind,blob){
  const path=`${pid}/${kind}-${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
  const r=await fetch(`${SB}/storage/v1/object/certs/${path}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'image/jpeg'},body:blob});
  if(!r.ok)throw new Error('upload');return path;
}
function rangeDates(s,e){const out=[];let d=new Date(s+'T00:00:00Z');const E=new Date(e+'T00:00:00Z');while(d<=E&&out.length<150){out.push(d.toISOString().slice(0,10));d=new Date(d.getTime()+864e5)}return out}
const fmt=d=>d?d.slice(5).replace('-','/'):'';
/* 설정은 나라별(KR/TH)로 따로 저장돼요. 화면 언어 = 나라 */
const cfg=c=>S&&S.settings?S.settings[c||(lang==='th'?'TH':'KR')]:null;
const title=()=>{const x=cfg();return x?x.title:''};
const tagline=()=>{const x=cfg();return x?x.tagline:''};

function setLang(l){lang=l;localStorage.setItem('d1_lang',l);document.documentElement.lang=l;render()}
function head(){
  $('langBox').innerHTML=['ko','th'].map(l=>`<button class="${l===lang?'on':''}" onclick="setLang('${l}')">${l==='ko'?'한국어':'ไทย'}</button>`).join('');
  const st=cfg();
  $('hTitle').textContent=title()||'…';document.title=title()||'Challenge';
  $('hTag').textContent=tagline();
  $('hPeriod').textContent=st&&st.start_date&&st.end_date?`${st.start_date.replace(/-/g,'.')} ${t('until')} ${st.end_date.replace(/-/g,'.')}`:t('noPeriod');
}
async function load(){
  S=await rpc('get_public_state');
  if(me){
    const m=await rpc('get_me',{p_id:me});
    if(!m){me='';myCerts=[];localStorage.removeItem('d1_me')}
    else{if(m.id!==me){me=m.id;localStorage.setItem('d1_me',me)}myCerts=await rpc('get_my_certs',{p_id:me})}
  }
}
function periodState(country){
  const st=cfg(country);if(!st||!st.start_date||!st.end_date)return 'noPeriod';
  const d=S.today[country];if(d<st.start_date)return 'notStarted';if(d>st.end_date)return 'ended';return 'open';
}
function render(){
  if(isAdmin){renderAdmin();return}
  head();
  const app=$('app');
  if(!S){app.innerHTML=`<div class="card">${t('loading')}</div>`;return}
  const keep=($('nameIn')||{}).value||'';
  const mp=S.participants.find(p=>p.id===me);
  let h='';
  if(!mp)h+=`<div class="card"><h2>${t('nameTitle')}</h2><input type="text" id="nameIn" maxlength="30" autocomplete="off" placeholder="${esc(t('namePh'))}" onkeydown="if(event.key==='Enter'&&!event.isComposing)enterName()"><div style="height:8px"></div><button class="btn" id="nameBtn" onclick="enterName()">${t('start')}</button><div class="note">${t('nameHelp')}</div></div>`;
  else h+=`<div class="card mebar"><span>👤 <b>${esc(mp.name)}</b></span><button class="btn sub sm" onclick="logout()">${t('switchName')}</button></div>`+myView(mp);
  h+=allView();
  app.innerHTML=h;
  if($('nameIn'))$('nameIn').value=keep;
  $('foot').innerHTML=`<a href="#" onclick="copyLink();return false">🔗 ${t('copy')}</a> · <a href="?admin=1">${t('admin')}</a>`;
}
function myView(mp){
  const st=cfg(mp.country),ps=periodState(mp.country),today=S.today[mp.country];
  const byDate={};myCerts.forEach(c=>{(byDate[c.challenge_date]=byDate[c.challenge_date]||{reg:0,pv:0})[c.kind]++});
  const tr=myCerts.filter(c=>c.challenge_date===today&&c.kind==='reg'),tp=myCerts.filter(c=>c.challenge_date===today&&c.kind==='pv');
  let h='';
  if(ps!=='open')h+=`<div class="banner">${t(ps)}</div>`;
  else{
    const n=(tr.length?1:0)+(tp.length?1:0);
    h+=`<div class="banner ${n===2?'ok-banner':''}">${n===2?t('allDone'):n===1?t('leftOne'):t('leftBoth')}</div>`;
  }
  h+=`<div class="card"><h2>${t('today')} <span class="chip">${fmt(today)}</span></h2><div class="kinds">`+
     kindCard('reg',tr,ps==='open',st)+kindCard('pv',tp,ps==='open',st)+`</div><div class="note">${t('multi')}</div></div>`;
  if(st&&st.start_date&&st.end_date){
    const ds=rangeDates(st.start_date,st.end_date);
    const need=st.required_days||ds.length;
    const done=ds.filter(d=>byDate[d]&&byDate[d].reg&&byDate[d].pv).length;
    h+=`<div class="card"><h2>${t('prog')}</h2><div class="stat"><span>${t('days',{n:done,t:ds.length})}</span><span>${st.required_days?t('goal',{n:st.required_days}):''}</span></div>
    <div class="prog"><i style="width:${Math.min(100,Math.round(done/need*100))}%"></i></div>
    <div class="cal">${ds.map((d,i)=>{const b=byDate[d];const c=b&&b.reg&&b.pv?'c2':b?'c1':'';return `<div class="${c} ${d===today?'today':''} ${d>today?'fut':''}">${+d.slice(8)}<small>${b?(b.reg?'🧾':'')+(b.pv?'📊':''):''}</small></div>`}).join('')}</div>
    <div class="legend"><span><i style="background:var(--main)"></i>${t('lg2')}</span><span><i style="background:#fde7b0"></i>${t('lg1')}</span><span><i style="background:#edf5f9"></i>${t('lg0')}</span></div></div>`;
  }
  return h;
}
function kindCard(kind,items,open,st){
  const ok=items.length>0,pv=st&&st.goal_pv?st.goal_pv:10000;
  return `<div class="kind ${ok?'done':''}"><div class="hd"><span class="tt">${kind==='reg'?'🧾':'📊'} ${t(kind)}</span><span class="chip ${ok?'ok':''}">${ok?t('doneKind')+' · '+t('cnt',{n:items.length}):t('notYet')}</span></div>
   <div class="ds">${kind==='reg'?t('regD'):t('pvD',{pv:pv.toLocaleString()})}</div>
   ${ok?`<div class="thumbs">${items.map(c=>`<div class="th"><img loading="lazy" src="${esc(pubUrl(c.image_path))}" onclick="zoom('${esc(pubUrl(c.image_path))}')"><b onclick="delMine('${c.id}')">×</b></div>`).join('')}</div>`:''}
   ${open?`<input type="text" id="note_${kind}" maxlength="60" placeholder="${kind==='reg'?t('noteReg'):t('notePv')}" style="margin-bottom:8px">
   <button class="btn ${kind}" ${busy?'disabled':''} onclick="$('f_${kind}').click()">${t('add')}</button>
   <input type="file" id="f_${kind}" accept="image/*" multiple class="hide" onchange="doUpload('${kind}',this)">`:''}</div>`;
}
function allView(){
  const list=S.participants.filter(p=>p.country===(lang==='th'?'TH':'KR')).slice().sort((a,b)=>b.days-a.days||a.name.localeCompare(b.name));
  if(!list.length)return '';
  return `<div class="card"><h2>${t('all')}</h2>${list.map(p=>`<div class="row"><span class="nm">${esc(p.name)}</span><span class="dot ${p.today_reg?'on':''}">🧾</span><span class="dot ${p.today_pv?'on':''}">📊</span><span class="dy">${p.days}</span></div>`).join('')}</div>`;
}
async function enterName(){
  if(busy)return;
  const v=($('nameIn').value||'').trim();
  if(!v||v.length>30){toast(t('badName'));return}
  busy=true;$('nameBtn').disabled=true;
  try{
    const r=await rpc('enter_name',{p_name:v,p_country:lang==='th'?'TH':'KR'});
    if(r.status==='exists'&&!confirm(t('existsQ',{name:r.name}))){busy=false;render();return}
    me=r.id;localStorage.setItem('d1_me',me);
    await load();busy=false;render();
    if(r.status==='created')toast(t('welcome',{name:r.name}));
  }catch(e){busy=false;toast(String(e.message).includes('bad_name')?t('badName'):t('fail'));render()}
}
function logout(){if(!confirm(t('logoutQ')))return;me='';myCerts=[];localStorage.removeItem('d1_me');render();window.scrollTo(0,0)}
async function refresh(){await load();render()}
async function doUpload(kind,input){
  const files=[...input.files];if(!files.length||busy)return;busy=true;
  const note=($('note_'+kind)||{}).value||'';let okc=0;
  try{
    for(let i=0;i<files.length;i++){
      toast(t('uploading',{i:i+1,n:files.length}),60000);
      const blob=await compress(files[i]);
      const path=await uploadBlob(me,kind,blob);
      await rpc('add_certification',{p_id:me,p_kind:kind,p_path:path,p_note:note||null});okc++;
    }
    toast(t('uploaded'));
  }catch(e){
    const m=String(e.message);
    toast(['not_started','ended','period_not_set'].includes(m)?t(m==='period_not_set'?'noPeriod':m==='not_started'?'notStarted':'ended'):t('fail'),3500);
  }
  busy=false;input.value='';await refresh();
}
async function delMine(id){if(!confirm(t('delConfirm')))return;try{await rpc('delete_my_cert',{p_id:me,p_cert:id})}catch(e){toast(t('fail'))}await refresh()}

const acfg=()=>(adminData.settings&&adminData.settings[adminCountry])||{};

adminDay=todayOf(adminCountry);
const TABS=[['status','📊 현황'],['day','📸 일별 인증샷'],['done','🏅 완주자'],['people','👥 참가자 관리'],['set','⚙️ 설정']];
const nk=s=>String(s||'').normalize('NFC').replace(/[\s ​-‍﻿　]+/g,'').toLowerCase();
const nameOf=id=>{const p=adminData&&adminData.participants.find(x=>x.id===id);return p?p.name:''};
function needDays(){
  const st=adminData?acfg():{};if(!st.start_date||!st.end_date)return null;
  const total=rangeDates(st.start_date,st.end_date).length;
  return {total,need:st.required_days?Math.min(st.required_days,total):total};
}
function renderAdmin(){
  $('langBox').innerHTML='';$('hTitle').textContent='관리자 · 1일 1등록 챌린지';$('hTag').textContent='현황 · 일별 인증샷 · 완주자 · 참가자 관리 · 설정';$('hPeriod').textContent='ADMIN';document.title='관리자';
  $('foot').innerHTML='<a href="./">← 참가자 화면</a>';
  if(!adminPw||!adminData){
    $('app').innerHTML=`<div class="card"><h2>관리자 비밀번호</h2><input type="password" id="apw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')adminLogin()"><div style="height:8px"></div><button class="btn" onclick="adminLogin()">로그인</button></div>`;return;
  }
  $('app').innerHTML=`<div class="tabs" style="margin-top:6px">${['KR','TH'].map(c=>`<button class="btn sm ${c===adminCountry?'':'sub'}" style="flex:1" onclick="setCountry('${c}')">${CTY[c]}</button>`).join('')}</div><div class="note" style="margin:0 0 4px">한국과 태국은 기간·설정이 따로예요. 선택한 나라의 참가자와 설정만 보여요.</div><div class="tabs scroll">${TABS.map(([k,l])=>`<button class="btn sm ${k===adminTab?'':'sub'}" onclick="setTab('${k}')">${l}</button>`).join('')}</div><div id="tabBody"></div>`;
  renderTab();
}
function setCountry(c){adminCountry=c;sessionStorage.setItem('d1_cty',c);adminSel.clear();adminQ='';adminDay=todayOf(c);adminDayData=null;renderAdmin()}
function setTab(k){adminTab=k;sessionStorage.setItem('d1_tab',k);adminQ='';renderAdmin()}
function renderTab(){
  const f={status:tabStatus,day:tabDay,done:tabDone,people:tabPeople,set:tabSet}[adminTab]||tabStatus;
  $('tabBody').innerHTML=f();
  if(adminTab==='status')fillStatus();
  if(adminTab==='day')adminLoadDay();
  if(adminTab==='people'){fillPeople();fillSelBar()}
}
async function adminLogin(){
  const pw=$('apw').value;
  try{adminData=await rpc('admin_overview',{pw});adminPw=pw;sessionStorage.setItem('d1_admin',pw);renderAdmin()}
  catch(e){toast('비밀번호가 맞지 않아요')}
}
async function adminReload(){try{adminData=await rpc('admin_overview',{pw:adminPw});renderAdmin()}catch(e){adminPw='';adminData=null;sessionStorage.removeItem('d1_admin');renderAdmin()}}

/* --- 현황 --- */
function tabStatus(){
  const rows=aps(),nd=needDays();
  const full=rows.filter(p=>p.today_reg&&p.today_pv).length,part=rows.filter(p=>(p.today_reg||p.today_pv)&&!(p.today_reg&&p.today_pv)).length;
  const fin=nd?rows.filter(p=>p.days>=nd.need).length:'-',photos=rows.reduce((a,p)=>a+p.photos,0);
  return `<div class="card"><h2>오늘 현황</h2><div class="stats"><div><b>${rows.length}</b><span>참가자</span></div><div><b>${full}</b><span>오늘 완료</span></div><div><b>${part}</b><span>오늘 일부</span></div><div><b>${fin}</b><span>완주</span></div></div>
   <div class="note" style="margin:0">전체 사진 ${photos}장 · ${nd?`완주 기준 ${nd.need}일 (기간 ${nd.total}일)`:'기간을 저장하면 완주 기준이 계산돼요 (⚙️ 설정)'}</div></div>
  <div class="card"><h2>참가자별 현황</h2><input type="text" id="adminQ" placeholder="이름 검색" value="${esc(adminQ)}" oninput="adminQ=this.value;fillStatus()"><div id="listBox"></div></div>`;
}
function fillStatus(){
  const nd=needDays(),q=nk(adminQ);
  const rows=aps().filter(p=>!q||nk(p.name).includes(q)).slice().sort((a,b)=>b.days-a.days||a.name.localeCompare(b.name));
  $('listBox').innerHTML=rows.map(p=>`<div class="row"><span class="nm">${KR_EMO[p.country]} ${esc(p.name)}${p.is_winner?' 🏆':p.is_candidate?' ⭐':''}<div class="note" style="margin:0">완료 ${p.days}${nd?' / '+nd.need:''}일 · 🧾 ${p.reg_days}일 · 📊 ${p.pv_days}일 · 사진 ${p.photos}장</div></span><span class="dot ${p.today_reg?'on':''}">🧾</span><span class="dot ${p.today_pv?'on':''}">📊</span><button class="btn sub sm" onclick="adminPhotos('${p.id}')">사진</button></div>`).join('')||'<div class="note" style="margin-top:8px">참가자가 없어요. 참가자가 링크에서 이름을 입력하면 여기에 나타나요.</div>';
}
async function adminPhotos(id){
  const name=nameOf(id),rows=await rpc('admin_get_certs',{pw:adminPw,p_id:id});
  $('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2 style="margin-bottom:10px">${esc(name)} · 인증 사진 ${rows.length}장</h2><div class="photos">${rows.map(c=>`<figure><img loading="lazy" src="${esc(pubUrl(c.image_path))}" onclick="zoom('${esc(pubUrl(c.image_path))}')"><figcaption>${c.kind==='reg'?'🧾 등록':'📊 PV'} · ${fmt(c.challenge_date)}${c.note?'<br>'+esc(c.note):''}<br><a href="#" style="color:var(--bad)" onclick="adminDelC('${c.id}','${id}');return false">삭제</a></figcaption></figure>`).join('')||'<div class="note">아직 사진이 없어요</div>'}</div><div style="height:10px"></div><button class="btn sub" onclick="closeModal()">닫기</button></div></div>`;
}
async function adminDelC(cid,pid){if(!confirm('이 인증 사진을 삭제할까요?'))return;await rpc('admin_delete_cert',{pw:adminPw,p_cert:cid});adminData=await rpc('admin_overview',{pw:adminPw});renderAdmin();adminPhotos(pid)}

/* --- 일별 인증샷 --- */
function tabDay(){
  return `<div class="card"><h2>📸 일별 인증샷</h2>
   <div class="datebar"><button class="btn sub sm" onclick="shiftDay(-1)">◀</button><input type="date" id="d_date" value="${adminDay}" onchange="setAdminDay(this.value)"><button class="btn sub sm" onclick="shiftDay(1)">▶</button><button class="btn sub sm" onclick="goToday()">오늘</button></div>
   <label class="chk"><input type="checkbox" id="d_miss" ${adminOnlyMissing?'checked':''} onchange="toggleMissing(this.checked)"> 미완료자만 보기</label>
   <div id="dayBox"><div class="note">불러오는 중…</div></div></div>`;
}
function renderDay(){
  const box=$('dayBox');if(!box)return;
  if(!adminDayData){box.innerHTML='<div class="note">불러오는 중…</div>';return}
  const rows=adminDayData.filter(p=>p.country===adminCountry).map(p=>{const r=p.certs.filter(c=>c.kind==='reg'),v=p.certs.filter(c=>c.kind==='pv');return Object.assign({},p,{r:r,v:v,st:(r.length&&v.length)?2:((r.length||v.length)?1:0)})});
  const n2=rows.filter(x=>x.st===2).length,nr=rows.filter(x=>x.r.length).length,nv=rows.filter(x=>x.v.length).length;
  const shown=adminOnlyMissing?rows.filter(x=>x.st<2):rows;
  const stTxt=['미인증','일부 인증','완료'];
  const th=(c,k)=>`<div class="th ${k}" title="${esc(c.note||'')}"><img loading="lazy" src="${esc(pubUrl(c.image_path))}" onclick="zoom('${esc(pubUrl(c.image_path))}')"><b onclick="adminDelDay('${c.id}')">×</b></div>`;
  box.innerHTML=`<div class="sum"><span class="chip ok">완료 ${n2} / ${rows.length}명</span><span class="chip">🧾 등록 ${nr}명</span><span class="chip">📊 PV ${nv}명</span></div>`+
   (shown.map(p=>`<div class="drow"><div class="hd"><span>${KR_EMO[p.country]} ${esc(p.name)}</span><span class="st st${p.st}">${stTxt[p.st]}</span></div>
     ${p.certs.length?`<div class="thumbs">${p.r.map(c=>th(c,'reg')).join('')}${p.v.map(c=>th(c,'pv')).join('')}</div><div class="note" style="margin:0">🧾 ${p.r.length}장 · 📊 ${p.v.length}장${p.certs.filter(c=>c.note).map(c=>' · '+esc(c.note)).join('')}</div>`:''}</div>`).join('')||'<div class="note">표시할 참가자가 없어요</div>');
}
async function adminLoadDay(){try{adminDayData=await rpc('admin_day_view',{pw:adminPw,p_date:adminDay});renderDay()}catch(e){toast('일일 현황을 불러오지 못했어요')}}
function setAdminDay(v){if(v){adminDay=v;adminDayData=null;renderDay();adminLoadDay()}}
function shiftDay(n){const d=new Date(adminDay+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);adminDay=d.toISOString().slice(0,10);const i=$('d_date');if(i)i.value=adminDay;adminDayData=null;renderDay();adminLoadDay()}
function goToday(){setAdminDay(todayOf(adminCountry));const i=$('d_date');if(i)i.value=adminDay}
function toggleMissing(v){adminOnlyMissing=v;renderDay()}
async function adminDelDay(cid){if(!confirm('이 인증 사진을 삭제할까요?'))return;try{await rpc('admin_delete_cert',{pw:adminPw,p_cert:cid});adminDayData=null;renderDay();adminData=await rpc('admin_overview',{pw:adminPw});adminLoadDay()}catch(e){toast('삭제에 실패했어요')}}

/* --- 완주자 · 특별상 --- */
function tabDone(){
  const nd=needDays();
  if(!nd)return `<div class="card"><h2>🏅 완주자</h2><div class="note">⚙️ 설정에서 시작일·종료일을 먼저 저장해 주세요.</div></div>`;
  const all=aps(),rows=all.filter(p=>p.days>=nd.need).sort((a,b)=>b.days-a.days||a.name.localeCompare(b.name));
  const win=all.filter(p=>p.is_winner),cand=all.filter(p=>p.is_candidate&&!p.is_winner);
  return `<div class="card"><h2>🏅 완주자 (${rows.length}명)</h2>
   <div class="note" style="margin:0 0 8px">완주 기준 ${nd.need}일 이상 · 기간 ${nd.total}일 · 참가자 ${all.length}명<br>하루 완료 = 같은 날 회원등록 인증 + PV 인증이 모두 있는 날. 기준 일수는 ⚙️ 설정에서 바꿀 수 있어요.</div>
   <button class="btn sub sm" style="width:auto" onclick="downloadCsv()">⬇️ 전체 현황 CSV 내려받기</button><div style="height:6px"></div>
   ${rows.map(p=>`<div class="row"><span class="nm">${KR_EMO[p.country]} ${esc(p.name)}<div class="note" style="margin:0">완료 ${p.days}일</div></span><button class="btn sm ${p.is_candidate?'':'sub'}" style="width:auto" onclick="toggleAward('${p.id}','c')">⭐ 후보</button><button class="btn sm ${p.is_winner?'':'sub'}" style="width:auto" onclick="toggleAward('${p.id}','w')">🏆 수상</button></div>`).join('')||'<div class="note">아직 완주자가 없어요</div>'}</div>
  <div class="card"><h2>🎁 특별상</h2>
   <div class="note" style="margin:0">🏆 수상 ${win.length}명${win.length?' · '+win.map(p=>esc(p.name)).join(', '):''}<br>⭐ 후보 ${cand.length}명${cand.length?' · '+cand.map(p=>esc(p.name)).join(', '):''}</div></div>`;
}
async function toggleAward(id,k){
  const p=adminData.participants.find(x=>x.id===id);if(!p)return;
  if(k==='c')p.is_candidate=!p.is_candidate;else p.is_winner=!p.is_winner;
  renderTab();
  try{await rpc('admin_set_award',{pw:adminPw,p_id:id,p_candidate:p.is_candidate,p_winner:p.is_winner})}catch(e){toast('저장에 실패했어요');adminReload()}
}
function downloadCsv(){
  const nd=needDays(),q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=['이름','나라','완료일수','등록인증일수','PV인증일수','사진수','완주','특별상'];
  const lines=[head.map(q).join(',')].concat(aps().slice().sort((a,b)=>b.days-a.days||a.name.localeCompare(b.name)).map(p=>[p.name,p.country==='TH'?'태국':'한국',p.days,p.reg_days,p.pv_days,p.photos,nd&&p.days>=nd.need?'완주':'',p.is_winner?'수상':p.is_candidate?'후보':''].map(q).join(',')));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='1일1등록챌린지_현황_'+(adminCountry==='TH'?'태국':'한국')+'.csv';document.body.appendChild(a);a.click();a.remove();
}

/* --- 참가자 관리 --- */
function tabPeople(){
  return `<div class="card"><h2>👥 참가자 관리 · ${CTY[adminCountry]} (${aps().length}명)</h2>
   <div class="note" style="margin:0 0 8px">참가자는 링크에서 직접 이름을 입력해 등록돼요. 같은 사람이 이름을 다르게 입력해 계정이 여러 개 생기면 선택해서 <b>합쳐</b> 주세요. 합쳐진 옛 이름·옛 링크로 들어와도 같은 계정으로 이어져요.</div>
   <input type="text" id="adminQ" placeholder="이름 검색" value="${esc(adminQ)}" oninput="adminQ=this.value;fillPeople()">
   <div class="bar"><button class="btn sub sm" onclick="selUnused()">사진 없는 참가자 선택</button><button class="btn sub sm" onclick="adminSel.clear();fillPeople();fillSelBar()">선택 해제</button></div>
   <div id="selBar" class="bar"></div><div id="listBox"></div></div>`;
}
function fillPeople(){
  const q=nk(adminQ),rows=aps().filter(p=>!q||nk(p.name).includes(q)).slice().sort((a,b)=>a.name.localeCompare(b.name));
  $('listBox').innerHTML=rows.map(p=>`<div class="row"><input type="checkbox" ${adminSel.has(p.id)?'checked':''} onchange="togSel('${p.id}',this.checked)"><span class="nm">${KR_EMO[p.country]} ${esc(p.name)}<div class="note" style="margin:0">완료 ${p.days}일 · 사진 ${p.photos}장 · 등록 ${(p.created_at||'').slice(5,10).replace('-','/')}</div></span><button class="btn sub sm" onclick="adminRename('${p.id}')">이름 변경</button></div>`).join('')||'<div class="note" style="margin-top:8px">참가자가 없어요</div>';
}
function fillSelBar(){
  const n=adminSel.size;
  $('selBar').innerHTML=n?`<span class="note" style="margin:0;align-self:center">선택 ${n}명</span><button class="btn sm" onclick="adminMerge()" ${n<2?'disabled':''}>합치기</button><button class="btn red sm" onclick="adminDelSel()">삭제</button>`:'';
}
function togSel(id,on){if(on)adminSel.add(id);else adminSel.delete(id);fillSelBar()}
function selUnused(){aps().forEach(p=>{if(!p.photos)adminSel.add(p.id)});fillPeople();fillSelBar()}
async function adminRename(id){
  const cur=nameOf(id),nn=prompt('새 이름',cur);if(nn==null||!nn.trim()||nn.trim()===cur)return;
  try{await rpc('admin_rename_participant',{pw:adminPw,p_id:id,p_name:nn});toast('이름을 바꿨어요 ✅');await adminReload()}
  catch(e){const m=String(e.message);toast(m.includes('name_taken')?'같은 이름(띄어쓰기·대소문자 무시)이 이미 있어요. 같은 사람이면 "합치기"를 쓰세요':m.includes('bad_name')?'이름을 1~30자로 입력해 주세요':'변경에 실패했어요',4200)}
}
function adminMerge(){
  const ps=adminData.participants.filter(p=>adminSel.has(p.id));if(ps.length<2){toast('합칠 참가자를 2명 이상 선택해 주세요');return}
  const best=ps.slice().sort((a,b)=>b.photos-a.photos)[0].id;
  $('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2 style="margin-bottom:6px">참가자 합치기</h2><div class="note" style="margin:0 0 8px">남길 이름을 고르세요. 나머지 계정의 인증 사진·기록이 모두 그 계정으로 옮겨지고, 나머지 계정은 사라져요. (되돌릴 수 없어요)</div>${ps.map(p=>`<label class="chk"><input type="radio" name="mt" value="${p.id}" ${p.id===best?'checked':''}> <span>${KR_EMO[p.country]} ${esc(p.name)} <span class="note" style="margin:0">· 사진 ${p.photos}장 · 완료 ${p.days}일</span></span></label>`).join('')}<div style="height:10px"></div><button class="btn" onclick="doMerge()">합치기</button><div style="height:8px"></div><button class="btn sub" onclick="closeModal()">취소</button></div></div>`;
}
async function doMerge(){
  const r=document.querySelector('input[name=mt]:checked');if(!r)return;
  const target=r.value,src=[...adminSel].filter(i=>i!==target);
  try{const j=await rpc('admin_merge_participants',{pw:adminPw,p_target:target,p_sources:src});closeModal();adminSel.clear();toast(`${j.merged}명을 합쳤어요 ✅ (사진 ${j.moved_photos}장 이동)`);await adminReload()}
  catch(e){toast('합치기에 실패했어요')}
}
async function adminDelSel(){
  const ps=adminData.participants.filter(p=>adminSel.has(p.id));if(!ps.length)return;
  const ph=ps.reduce((a,p)=>a+p.photos,0);
  if(!confirm(`선택한 ${ps.length}명(${ps.slice(0,5).map(p=>p.name).join(', ')}${ps.length>5?' 외':''})과 인증 사진 ${ph}장을 삭제할까요?\n되돌릴 수 없어요.`))return;
  try{const n=await rpc('admin_delete_participants',{pw:adminPw,p_ids:ps.map(p=>p.id)});adminSel.clear();toast(n+'명을 삭제했어요');await adminReload()}
  catch(e){toast('삭제에 실패했어요')}
}

/* --- 설정 --- */
function tabSet(){
  const st=acfg();
  return `<div class="card"><h2>📅 기간 · 문구 설정 · ${CTY[adminCountry]}</h2>
   <div class="note" style="margin:0 0 6px">${CTY[adminCountry]} 챌린지의 설정이에요. 위에서 나라를 바꾸면 그 나라의 설정을 따로 저장할 수 있어요.</div>
   <div class="two"><div><label class="lbl">시작일</label><input type="date" id="s_start" value="${st.start_date||''}"></div><div><label class="lbl">종료일</label><input type="date" id="s_end" value="${st.end_date||''}"></div></div>
   <div class="two"><div><label class="lbl">PV 목표</label><input type="number" id="s_pv" value="${st.goal_pv||10000}"></div><div><label class="lbl">완주 기준 일수(비우면 전체)</label><input type="number" id="s_req" value="${st.required_days||''}"></div></div>
   <label class="lbl">제목 (${adminCountry==='TH'?'태국어':'한국어'})</label><input type="text" id="s_title" value="${esc(st.title)}">
   <label class="lbl">소개 문구 (${adminCountry==='TH'?'태국어':'한국어'})</label><input type="text" id="s_tag" value="${esc(st.tagline)}">
   <div style="height:10px"></div><button class="btn" onclick="adminSave()">${CTY[adminCountry]} 설정 저장</button>
   <div class="note">하루 기준은 ${adminCountry==='TH'?'태국 시간':'한국 시간'} 자정까지예요. 기간을 저장하기 전에는 인증이 막혀요.</div></div>
  <div class="card"><h2>🔑 비밀번호 변경</h2><input type="password" id="n_pw" placeholder="새 비밀번호 (6자 이상)"><div style="height:8px"></div><button class="btn sub" onclick="adminPw2()">변경</button><div class="note">관리자 비밀번호는 한국·태국 공통이에요.</div></div>`;
}
async function adminSave(){
  try{await rpc('admin_save_country_settings',{pw:adminPw,p_country:adminCountry,p_start:$('s_start').value||null,p_end:$('s_end').value||null,p_title:$('s_title').value,p_tagline:$('s_tag').value,p_goal_pv:parseInt($('s_pv').value)||10000,p_required_days:parseInt($('s_req').value)||null});toast(CTY[adminCountry]+' 설정이 저장되었어요 ✅');await adminReload()}
  catch(e){toast(String(e.message)==='bad_period'?'종료일이 시작일보다 빨라요':'저장에 실패했어요')}
}
async function adminPw2(){try{await rpc('admin_change_password',{pw:adminPw,new_pw:$('n_pw').value});adminPw=$('n_pw').value;sessionStorage.setItem('d1_admin',adminPw);$('n_pw').value='';toast('비밀번호가 변경되었어요 ✅')}catch(e){toast('6자 이상 입력해 주세요')}}

/* ---------------- 시작 ---------------- */
document.documentElement.lang=lang;
if(isAdmin){if(adminPw)adminReload();else renderAdmin()}
else{render();load().then(render).catch(()=>{$('app').innerHTML='<div class="card">⚠️ 연결에 실패했어요. 새로고침해 주세요.</div>'})}
</script>
</body>
</html>
